[tools]
cocoapods = "1.15.2"
node = "20.12.2"
ruby = "3.2"
terraform = "1"
yarn = "1.22.22"

[tasks.install-deps]
description = "Install dependencies"
run = """
#!/usr/bin/env zsh
yarn install
"""

[tasks.dev]
description = "Run dev"
run = """
#!/usr/bin/env zsh
yarn dev
"""

[tasks.format]
description = "Format code using Biome"
run = """
#!/usr/bin/env zsh
yarn format
"""

[tasks.lint]
description = "Lint code using Biome"
run = """
#!/usr/bin/env zsh
yarn lint
"""

[tasks.check]
description = "Check and fix code using Biome"
run = """
#!/usr/bin/env zsh
yarn check
"""

[tasks.prebuild]
description = "Check and fix code using Biome"
run = """
#!/usr/bin/env zsh
yarn prebuild
"""

[tasks."terraform:init"]
description = "Initializes a Terraform working directory"
run = "terraform -chdir=terraform init"

[tasks."terraform:plan:dev"]
description = "Plan Terraform changes for dev environment"
run = "terraform -chdir=terraform plan -var-file=environments/dev.tfvars"

[tasks."terraform:apply:dev"]
description = "Applies the changes required to reach the desired state of the configuration"
run = "terraform -chdir=terraform apply -var-file=environments/dev.tfvars"

[tasks."terraform:destroy:dev"]
description = "Destroy Terraform-managed infrastructure"
run = "terraform -chdir=terraform destroy  -var-file=environments/dev.tfvars"

[tasks."terraform:validate"]
description = "Validates the Terraform files"
run = "terraform -chdir=terraform validate"

[tasks."terraform:format"]
description = "Formats the Terraform files"
run = "terraform -chdir=terraform fmt"

[tasks."terraform:check"]
description = "Checks the Terraform files"
depends = ["terraform:format", "terraform:validate"]
